frequency: 50
sensor_timeout: 0.1
two_d_mode: true

odom_frame: odom_ekf
base_link_frame: base_footprint
world_frame: odom_ekf

publish_tf: true
publish_acceleration: false

# Wheel odometry: use linear velocity X and yaw rate
odom0: /odom
odom0_config: [false, false, false,
               false, false, false,
               true,  false, false,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_relative: false

# BNO055 IMU (IMUPLUS mode — no magnetometer, relative heading)
# Use only gyro yaw rate and linear acceleration X (skip absolute orientation — yaw drifts without mag)
imu0: /imu
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, true,
              true, false, false]
imu0_differential: false
imu0_relative: true
imu0_remove_gravitational_acceleration: true
